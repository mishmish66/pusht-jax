[project]
name = "pusht-jax"
version = "0.1.0"
description = "Push-T in pure JAX, as jax_pomdps POMDPs."
license = "LicenseRef-VibeCoded-AI-Slop-1.0 AND Apache-2.0 AND MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.14"
dependencies = ["jax>=0.11.2", "jax-pomdps"]

[project.optional-dependencies]
cuda = ["jax[cuda]>=0.11.2"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
jax-pomdps = { git = "https://github.com/mishmish66/jax-pomdps" }

[build-system]
requires = ["uv_build>=0.8.14,<0.9"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
